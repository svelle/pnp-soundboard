version: '3.8'

services:
  soundboard:
    build: .
    container_name: dnd-soundboard
    expose:
      - "3000"
    environment:
      - PORT=3000
      - SOUNDBOARD_PASSWORD=${SOUNDBOARD_PASSWORD:-change-me}
    volumes:
      # Persist sounds directory
      - ./sounds:/app/sounds
    restart: unless-stopped
    networks:
      - soundboard-network

  nginx:
    image: nginx:alpine
    container_name: dnd-soundboard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - soundboard-network
    depends_on:
      - soundboard

networks:
  soundboard-network:
    driver: bridge
